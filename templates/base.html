<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}رزومه {{ profile.name }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="nav">
  <a class="logo" href="/">⚡ {{ profile.name }}</a>
  <nav>
    <a href="/" class="{{ 'active' if request.path=='/' }}">خانه</a>
    <a href="/about" class="{{ 'active' if request.path=='/about' }}">درباره من</a>
    <a href="/portfolio" class="{{ 'active' if request.path.startswith('/portfolio') }}">نمونه‌کار</a>
    <a href="/contact" class="{{ 'active' if request.path=='/contact' }}">تماس</a>
  </nav>
  <button id="themeBtn" title="حالت شب/روز">🌙</button>
</header>

<main class="wrap">
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, m in msgs %}
    <div class="flash {{ cat }}">{{ m }}</div>
  {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>

<footer>
  ساخته شده با ❤️ و Flask • {{ profile.name }} • <a href="/messages">پیام‌ها</a>
</footer>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
